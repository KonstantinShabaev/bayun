[project]
name = "bayun-stt"
version = "0.0.1"
description = "Wyoming STT-сервер для русского языка: GigaAM, нормализация, speaker ID"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "wyoming>=1.5",
]

[project.optional-dependencies]
# Тяжёлые зависимости ставятся отдельно: uv sync --extra gigaam
gigaam = ["gigaam"]
whisper = ["faster-whisper>=1.0"]

[project.scripts]
bayun-stt = "bayun_stt.__main__:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bayun_stt"]
