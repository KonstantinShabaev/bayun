[project]
name = "bayun-stt"
version = "0.0.1"
description = "Wyoming STT-сервер для русского языка: GigaAM, нормализация, speaker ID"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "wyoming>=1.5",
    "numpy>=1.26",
]

[project.optional-dependencies]
# Тяжёлые зависимости ставятся отдельно: uv sync --extra onnx
# GigaAM идёт через onnx-asr: без torch и без старого onnxruntime пакета gigaam.
whisper = ["faster-whisper>=1.0"]
onnx = ["onnx-asr[cpu,hub]>=0.12"]

[project.scripts]
bayun-stt = "bayun_stt.__main__:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bayun_stt"]
