[project]
name = "bayun"
version = "0.0.0"
description = "Баюн: русский голос и агентный «мозг» для Home Assistant"
requires-python = ">=3.12"
readme = "README.md"
license = "Apache-2.0"

[tool.uv]
package = false

[tool.uv.workspace]
members = ["stt", "brain", "bench"]

[tool.uv.sources]
bayun-stt = { workspace = true }
bayun-brain = { workspace = true }
bayun-bench = { workspace = true }

[dependency-groups]
dev = [
    "bayun-stt",
    "bayun-brain",
    "bayun-bench",
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "types-PyYAML",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["custom_components"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
# Русский текст в строках и комментариях — это нормально.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["bayun_stt", "bayun_brain", "bayun_bench"]
mypy_path = ["stt", "brain", "bench"]

[[tool.mypy.overrides]]
module = ["wyoming.*", "jiwer.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["stt/tests", "brain/tests", "bench/tests"]
asyncio_mode = "auto"
