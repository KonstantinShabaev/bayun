[project]
name = "bayun"
version = "0.0.0"
description = "Баюн: русский голос и агентный «мозг» для Home Assistant"
requires-python = ">=3.12,<3.14"
readme = "README.md"
license = "Apache-2.0"

[tool.uv]
package = false
# openWakeWord тянет tflite-runtime, у которого нет колёс под Python 3.12.
# Мы используем его ONNX-модели, tflite не нужен.
override-dependencies = ["tflite-runtime; sys_platform == 'never'"]
environments = ["sys_platform == 'linux'", "sys_platform == 'darwin'"]

[tool.uv.workspace]
members = ["stt", "brain", "bench", "voice"]

[tool.uv.sources]
bayun-stt = { workspace = true }
bayun-brain = { workspace = true }
bayun-bench = { workspace = true }
bayun-voice = { workspace = true }
# torch для Silero: CPU-сборка, без CUDA на гигабайты.
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = [
    "bayun-stt",
    "bayun-brain",
    "bayun-bench",
    "bayun-voice",
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "types-PyYAML",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["custom_components"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
# Русский текст в строках и комментариях — это нормально.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["bayun_stt", "bayun_brain", "bayun_bench", "bayun_voice"]
mypy_path = ["stt", "brain", "bench", "voice"]

[[tool.mypy.overrides]]
module = [
    "wyoming.*",
    "jiwer.*",
    "faster_whisper.*",
    "onnx_asr.*",
    "silero.*",
    "torch.*",
    "litellm.*",
    "openwakeword.*",
    "piper.*",
    "claude_agent_sdk.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["stt/tests", "brain/tests", "bench/tests", "voice/tests"]
asyncio_mode = "auto"
