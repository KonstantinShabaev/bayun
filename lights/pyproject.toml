[project]
name = "bayun-lights"
version = "0.0.1"
description = "Свои эффекты и светомузыка для ламп Tuya напрямую по локальной сети, без облака"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = []

[project.optional-dependencies]
# Локальный протокол Tuya 3.3–3.5. Без него работает только --dry-run.
tuya = ["tinytuya>=1.13"]

[project.scripts]
bayun-lights = "bayun_lights.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bayun_lights"]
