# Скопируйте в config.yaml рядом с запуском: bayun-voice --config config.yaml
audio:
  input_device: null        # null — источник по умолчанию в PipeWire (pactl get-default-source)
  output_device: null       # null — выход по умолчанию; лучше указать явно, PipeWire
                            # после перезагрузки может выбрать выход USB-микрофона

wake:
  # Своей модели «Волтер» ещё нет: пока стандартная английская «hey jarvis».
  model: "hey_jarvis"       # имя встроенной модели openWakeWord или путь к .onnx
  threshold: 0.5

listen:
  start_timeout_s: 4.0      # сколько ждать начала фразы после имени
  silence_s: 0.8            # пауза, после которой фраза считается законченной
  max_s: 12.0
  follow_up_s: 5.0          # ждать продолжения разговора без имени; 0 — не ждать
  beep: false               # тихий сигнал «слушаю» после имени

stt:
  engine: "onnx-gigaam-v3-e2e-ctc"   # или whisper-small (extra whisper), dummy

tts:
  engine: "piper"           # piper, silero (живее, extra silero) локально; elevenlabs — облако
  speaker: "eugene"         # диктор Silero: aidar, eugene, baya, kseniya, xenia
  pronounce: {}             # как произносить слова, например {"Волтер": "Уо+лтэр"}
  yandex:                   # SpeechKit, ключ в переменной YANDEX_API_KEY
    voice: "filipp"
    emotion: null           # good, evil, neutral — не у всех голосов
    speed: 1.0
  elevenlabs:               # ключ в переменной ELEVENLABS_API_KEY
    voice_id: ""            # голос из библиотеки ElevenLabs, который хорошо говорит по-русски
    model: "eleven_v3"
  voice: "voices/ru_RU-dmitri-medium.onnx"
  phonemes: null            # язык фонем вместо родного языка голоса
  length_scale: null        # темп, больше 1 — медленнее
  accent: null              # китайский акцент: zh, zh-strong, zh-max (см. accent.py)
  # phonemes: "ru" с голосом zh_CN-huayan-medium тоже даёт акцент, но звучит как
  # китайская речь, а не русская.

brain:
  url: "http://127.0.0.1:8765"

status:
  host: "0.0.0.0"           # страница состояния: http://<сервер>:8770
  port: 8770
