[project]
name = "bayun-voice"
version = "0.0.1"
description = "Голосовой цикл Баюна на сервере: имя → запись → STT → brain → Piper → колонки"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "bayun-stt",
    "numpy>=1.26",
    "httpx>=0.27",
    "pydantic>=2.8",
    "pyyaml>=6",
]

[project.optional-dependencies]
# Модели ставятся отдельно: uv sync --extra local
local = [
    "openwakeword>=0.6",
    "piper-tts>=1.3",
    "bayun-stt[onnx]",
]

[project.scripts]
bayun-voice = "bayun_voice.__main__:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bayun_voice"]
