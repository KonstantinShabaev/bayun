<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Баюн</title>
<style>
  :root { --bg: #111418; --fg: #e8e6e3; --muted: #8a8f98; --idle: #3a3f47;
          --listening: #3fa7ff; --thinking: #e8b33f; --speaking: #4fd18b; --error: #ff6b6b; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg);
         font: 22px/1.4 system-ui, sans-serif; height: 100vh; display: grid;
         grid-template-columns: minmax(280px, 1fr) 2fr; gap: 32px; padding: 32px; }
  .left { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 28px; }
  .orb { width: 220px; height: 220px; border-radius: 50%; background: var(--idle);
         transition: background .2s, transform .2s; }
  .orb.listening { background: var(--listening); animation: pulse 1s infinite; }
  .orb.thinking { background: var(--thinking); animation: pulse 0.6s infinite; }
  .orb.speaking { background: var(--speaking); }
  .orb.error { background: var(--error); }
  @keyframes pulse { 50% { transform: scale(1.07); } }
  .phase { font-size: 34px; }
  button { font: inherit; font-size: 28px; padding: 18px 40px; border-radius: 16px; border: 0;
           background: #2b3a4d; color: var(--fg); cursor: pointer; }
  button:active { background: #3fa7ff; }
  .hint { color: var(--muted); font-size: 18px; text-align: center; }
  .log { overflow: auto; display: flex; flex-direction: column; gap: 14px; justify-content: flex-end; }
  .msg { max-width: 90%; padding: 14px 20px; border-radius: 18px; }
  .user { align-self: flex-end; background: #2b3a4d; }
  .bayun { align-self: flex-start; background: #1f3328; }
  .system { align-self: center; color: var(--muted); font-size: 18px; }
  .timings { color: var(--muted); font-size: 16px; text-align: center; min-height: 1.4em; }
  .right { display: flex; flex-direction: column; gap: 20px; min-height: 0; }
  .board { display: flex; flex-wrap: wrap; gap: 16px; }
  .board:empty { display: none; }
  .card { background: #1a1f26; border-radius: 18px; padding: 16px 20px; min-width: 220px;
          flex: 1 1 220px; display: flex; flex-direction: column; gap: 10px; }
  .card .hint { text-align: left; }
  .card h3 { margin: 0; font-size: 17px; font-weight: 500; color: var(--muted);
             text-transform: uppercase; letter-spacing: .06em; }
  .big { font-size: 46px; line-height: 1; }
  .item { display: flex; align-items: center; gap: 12px; }
  .item .what { flex: 1; overflow: hidden; text-overflow: ellipsis; }
  .item .left-time { font-variant-numeric: tabular-nums; color: var(--thinking); }
  .item.ringing .left-time { color: var(--error); animation: pulse .8s infinite; }
  .x { font-size: 22px; padding: 6px 16px; border-radius: 12px; background: #2a2f38; }
  .x:active { background: var(--error); }
  .right .log { flex: 1; min-height: 0; }
  @media (max-width: 800px) { body { grid-template-columns: 1fr; height: auto; }
                              .orb { width: 140px; height: 140px; } }
</style>
</head>
<body>
<div class="left">
  <div id="orb" class="orb"></div>
  <div id="phase" class="phase">…</div>
  <button id="talk">Говорить</button>
  <div id="wake" class="hint"></div>
  <div id="timings" class="timings"></div>
</div>
<div class="right">
  <div id="board" class="board"></div>
  <div id="log" class="log"></div>
</div>
<script>
const PHASES = { idle: "Жду имени", listening: "Слушаю", thinking: "Думаю",
                 speaking: "Говорю", error: "Ошибка", loading: "Загружаю модели" };
const orb = document.getElementById("orb"), phase = document.getElementById("phase");
const log = document.getElementById("log"), timings = document.getElementById("timings");
const wake = document.getElementById("wake");
document.getElementById("talk").onclick = () => fetch("talk", { method: "POST" });
function render(s) {
  orb.className = "orb " + s.phase;
  phase.textContent = PHASES[s.phase] || s.phase;
  wake.textContent = s.wake_word ? `Скажите «${s.wake_word}» или нажмите кнопку` : "";
  const t = s.timings || {};
  const parts = [];
  if (t.stt_s != null) parts.push(`распознавание ${t.stt_s.toFixed(2)} с`);
  if (t.first_s != null) parts.push(`первая фраза ${t.first_s.toFixed(2)} с`);
  timings.textContent = parts.join(" · ");
  log.replaceChildren(...s.log.map(m => {
    const d = document.createElement("div");
    d.className = "msg " + m.who; d.textContent = m.text; return d;
  }));
  log.scrollTop = log.scrollHeight;
}
function connect() {
  const es = new EventSource("events");
  let last = "";
  es.onmessage = e => {
    const s = JSON.parse(e.data);
    render(s);
    // Разговор кончился — могли поставить таймер или что-то запомнить.
    if (s.phase !== last && s.phase === "idle") loadBoard();
    last = s.phase;
  };
  es.onerror = () => { es.close(); setTimeout(connect, 2000); };
}
connect();

// Табло: погода, таймеры и будильники с обратным отсчётом, что Баюн помнит.
const board = document.getElementById("board");
let dash = null, skew = 0;
const signed = t => `${t > 0 ? "+" : ""}${t}°`;
function left(sec) {
  sec = Math.max(0, Math.round(sec));
  const h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60), s = sec % 60;
  const mm = String(m).padStart(2, "0"), ss = String(s).padStart(2, "0");
  return h ? `${h}:${mm}:${ss}` : `${m}:${ss}`;
}
function clock(ts) {
  return new Date(ts * 1000).toLocaleTimeString("ru-RU", { hour: "2-digit", minute: "2-digit" });
}
function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}
function remove(path) {
  fetch("brain/api/" + path, { method: "DELETE" }).then(loadBoard);
}
function drawBoard() {
  if (!dash) return;
  const now = Date.now() / 1000 - skew, cards = [];
  const w = dash.weather;
  if (w) {
    const c = el("div", "card");
    c.append(el("h3", "", "Погода"), el("div", "big", signed(w.temp)),
             el("div", "", `${w.sky}, днём ${signed(w.high)}` + (w.rain >= 50 ? ", осадки" : "")),
             el("div", "hint", `Завтра ${signed(w.tomorrow_high)}, ${w.tomorrow_sky}`));
    cards.push(c);
  }
  if (dash.reminders.length) {
    const c = el("div", "card");
    c.append(el("h3", "", "Поставлено"));
    for (const r of dash.reminders) {
      const row = el("div", "item" + (r.ringing ? " ringing" : ""));
      const text = r.text.charAt(0).toUpperCase() + r.text.slice(1);
      const label = r.kind === "alarm" ? "Будильник"
                  : r.kind === "timer" ? (r.text ? `Таймер «${r.text}»` : "Таймер") : text;
      const due = r.due_at - now;
      const time = r.ringing ? "звенит" : due > 6 * 3600 ? clock(r.due_at) : left(due);
      const x = el("button", "x", "✕");
      x.onclick = () => remove("reminders/" + r.id);
      row.append(el("span", "what", label), el("span", "left-time", time), x);
      c.append(row);
    }
    cards.push(c);
  }
  if (dash.facts.length) {
    const c = el("div", "card");
    c.append(el("h3", "", "Помню"));
    for (const f of dash.facts.slice(-6)) {
      const row = el("div", "item"), x = el("button", "x", "✕");
      x.onclick = () => remove("facts/" + f.id);
      row.append(el("span", "what", f.text), x);
      c.append(row);
    }
    cards.push(c);
  }
  board.replaceChildren(...cards);
}
function loadBoard() {
  fetch("brain/api/dashboard").then(r => r.ok ? r.json() : null).then(d => {
    if (d) { dash = d; skew = Date.now() / 1000 - d.now; }
    drawBoard();
  }).catch(() => {});
}
loadBoard();
setInterval(loadBoard, 10000);
setInterval(drawBoard, 1000);
</script>
</body>
</html>
