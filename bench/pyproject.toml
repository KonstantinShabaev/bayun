[project]
name = "bayun-bench"
version = "0.0.1"
description = "Бенчмарк распознавания русских голосовых команд: WER/CER и латентность"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "jiwer>=3.0",
]

[project.scripts]
bayun-bench = "bayun_bench.run_wer:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bayun_bench"]
