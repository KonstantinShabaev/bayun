# Черновой стенд: brain ходит в Anthropic напрямую, пока нет шлюза (deploy/server, этап 4).
# Ключ — в ~/.config/bayun/brain.env: ANTHROPIC_API_KEY=...
llm:
  main: "anthropic/claude-haiku-5-5"
  fallbacks: ["anthropic/claude-sonnet-5-5"]
  max_tokens: 400
  timeout_s: 20

assistant:
  name: "Волтер"

database: "bayun.db"

home_assistant:
  url: "http://127.0.0.1:8123"   # HA в ВМ, проброшен на хост
  token_file: "~/.config/bayun/ha_token"

video:
  # Открывает URL в киоске Chromium на ТВ и переключает вход (делает серверная часть).
  open_command: ["/home/walter/bayun/bin/tv-open"]
  home_command: ["/home/walter/bayun/bin/tv-open", "--home"]
  volume_command:
    ["/home/walter/.local/share/bayun/atv-venv/bin/python", "/home/walter/.config/bayun/androidtv/key.py"]
  player_command: ["/home/walter/bayun/bin/tv-open"]
