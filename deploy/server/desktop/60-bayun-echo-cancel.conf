# PipeWire: микрофон с эхоподавлением WebRTC для сателлита в комнате с сервером.
# Опорный сигнал — то, что ноутбук сам играет (HDMI → ТВ), поэтому оптика и
# отдельная звуковая карта не нужны.
#
# Положить в ~/.config/pipewire/pipewire.conf.d/ пользователя рабочего стола,
# затем: systemctl --user restart pipewire pipewire-pulse wireplumber
# Сателлиту указать источник «bayun_aec_source».
context.modules = [
  {
    name = libpipewire-module-echo-cancel
    args = {
      library.name = aec/libspa-aec-webrtc
      # Брать опорный сигнал с монитора выхода по умолчанию.
      monitor.mode = true
      aec.args = {
        webrtc.noise_suppression = true
        webrtc.gain_control = true
        webrtc.extended_filter = true
      }
      capture.props = {
        node.name = "capture.bayun_aec"
        node.passive = true
      }
      source.props = {
        node.name = "bayun_aec_source"
        node.description = "Баюн: микрофон с эхоподавлением"
      }
    }
  }
]
