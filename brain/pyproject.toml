[project]
name = "bayun-brain"
version = "0.0.1"
description = "Агентный «мозг» Баюна: LLM, инструменты Home Assistant, память, политика безопасности"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.8",
    "pyyaml>=6",
]

[project.optional-dependencies]
llm = ["litellm>=1.50"]

[project.scripts]
bayun-brain = "bayun_brain.__main__:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bayun_brain"]

[tool.hatch.build.targets.wheel.force-include]
"bayun_brain/memory/schema.sql" = "bayun_brain/memory/schema.sql"
